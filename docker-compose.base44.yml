# بيئة التشغيل المحلية لتطبيق «فيديو قصيرة».
# خدمة واحدة (Node) تخدم الواجهة وواجهة JSON على المنفذ 3000.
services:
  web:
    image: node:22-slim
    working_dir: /app
    command: ["node", "--watch", "shortvideo/server.mjs"]
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
      - NODE_ENV=development
      - PAYMENT_CURRENCY=sar
    env_file:
      - /run/base44/app.env
    ports:
      - "3000:3000"
    volumes:
      - "${BASE44_PROJECT_ROOT}:/app"
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
